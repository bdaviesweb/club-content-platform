services:
  postgres:
    image: postgres:16-alpine
    container_name: club-content-postgres
    environment:
      POSTGRES_DB: club_content
      POSTGRES_USER: club
      POSTGRES_PASSWORD: club
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d club_content"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: club-content-redis

  minio:
    image: minio/minio:latest
    container_name: club-content-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data

  app-api:
    build:
      context: .
      dockerfile: apps/app-api/Dockerfile
    container_name: club-content-app-api
    env_file:
      - .env.vps
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    container_name: club-content-admin-web
    env_file:
      - .env.vps
    ports:
      - "3002:3001"
    depends_on:
      app-api:
        condition: service_started

  mobile-web:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile.web
      args:
        EXPO_PUBLIC_API_BASE_URL: https://clubcontent-api.davmn.net
        EXPO_PUBLIC_CLUB_SLUG: demo-soccer-club
        EXPO_PUBLIC_TEAM_SLUG: u14-girls
        EXPO_PUBLIC_SUBMITTER_EMAIL: coach@demo-club.local
        EXPO_PUBLIC_REVIEWER_EMAIL: comms@demo-club.local
        EXPO_PUBLIC_APP_NAME: Club Content
        EXPO_PUBLIC_APP_SLUG: club-content
        EXPO_PUBLIC_APP_VERSION: 0.1.0
        EXPO_PUBLIC_IOS_BUNDLE_IDENTIFIER: com.hermes.clubcontent
        EXPO_PUBLIC_ANDROID_PACKAGE: com.hermes.clubcontent
        EXPO_PUBLIC_EXPO_OWNER: clubcontent
        EXPO_PUBLIC_WORKSPACE_MODE: poster
    container_name: club-content-mobile-web
    ports:
      - "3003:3000"
    depends_on:
      app-api:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: club-content-worker
    env_file:
      - .env.vps
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
